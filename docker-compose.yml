services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admission_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
      POSTGRES_DB: school_admission
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission_user -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/SchoolAdmission.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=school_admission;Username=admission_user;Password=${POSTGRES_PASSWORD:-local_dev_only_password}"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      APPLY_MIGRATIONS: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
