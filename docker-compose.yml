services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admission_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_password}
      POSTGRES_DB: school_admission

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission_user -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: